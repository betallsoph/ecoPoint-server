version: "2"
sql:
  - engine: postgresql
    # Explicit ordered list — KHÔNG include *.down.sql vì sqlc đọc tuần tự
    # sẽ rollback virtual schema.
    schema:
      - "db/migrations/001_schema.sql"
      - "db/migrations/002_ecopoint_v1_3_upgrade.up.sql"
    queries: db/queries
    gen:
      go:
        package: pointdb
        out: db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        emit_exact_table_names: false
        emit_prepared_queries: false
