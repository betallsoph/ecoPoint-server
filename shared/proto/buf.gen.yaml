version: v2
clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ecopoint/ecopoint/shared/libs/go

plugins:
  # ---------- Golang ----------
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: ../libs/go
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: ../libs/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # ---------- TypeScript (Node.js) ----------
  - remote: buf.build/bufbuild/es:v2.2.0
    out: ../libs/ts
    opt:
      - target=ts
      - import_extension=js

  - remote: buf.build/connectrpc/es:v1.6.1
    out: ../libs/ts
    opt:
      - target=ts
      - import_extension=js
