version: v2
# clean: false — không xoá ../libs/ts vì có package.json + node_modules của @ecopoint/proto.
clean: false

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ecopoint/ecopoint/shared/libs/go

plugins:
  # ---------- Golang ----------
  - remote: buf.build/protocolbuffers/go:v1.34.2
    out: ../libs/go
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: ../libs/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # ---------- TypeScript (Node.js) ----------
  - remote: buf.build/bufbuild/es:v1.10.0
    out: ../libs/ts
    opt:
      - target=ts
      - import_extension=.js
      - ts_nocheck=false

  - remote: buf.build/connectrpc/es:v1.6.1
    out: ../libs/ts
    opt:
      - target=ts
      - import_extension=.js
