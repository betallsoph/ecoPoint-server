syntax = "proto3";

package ecopoint.reward.v1;

import "ecopoint/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service RewardService {
  rpc ListVouchers(ListVouchersRequest) returns (ListVouchersResponse);
  rpc RedeemVoucher(RedeemVoucherRequest) returns (RedeemVoucherResponse);
}

message Voucher {
  string id = 1;
  string code = 2;
  string title = 3;
  string description = 4;
  ecopoint.common.v1.Decimal point_cost = 5;
  int32 stock = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListVouchersRequest {
  // Bỏ trống = tất cả active. Set true/false để filter rõ.
  bool only_active = 1;
  int32 limit = 2;
}

message ListVouchersResponse {
  repeated Voucher vouchers = 1;
}

enum RedemptionStatus {
  REDEMPTION_STATUS_UNSPECIFIED = 0;
  REDEMPTION_STATUS_PENDING = 1;
  REDEMPTION_STATUS_COMPLETED = 2;
  REDEMPTION_STATUS_CANCELLED = 3;
}

message Redemption {
  string id = 1;
  string voucher_id = 2;
  string user_id = 3;
  ecopoint.common.v1.Decimal point_cost = 4;
  RedemptionStatus status = 5;
  string point_tx_id = 6;
  string failure_reason = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp completed_at = 9;
}

message RedeemVoucherRequest {
  string user_id = 1;
  string voucher_id = 2;
  // Bắt buộc — chống double-redeem khi client retry.
  string idempotency_key = 3;
}

message RedeemVoucherResponse {
  Redemption redemption = 1;
  // Số dư sau khi trừ điểm (lấy từ Point Service).
  ecopoint.common.v1.Decimal new_balance = 2;
}
