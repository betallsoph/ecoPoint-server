syntax = "proto3";

package ecopoint.booking.v1;

import "ecopoint/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service BookingService {
  // User tạo đơn — server tự sinh PIN 4 số (TTL 10 phút) trả về cho mobile.
  rpc CreateBooking(CreateBookingRequest) returns (CreateBookingResponse);

  // Vựa (Station) nhận đơn → service tự gọi Point.DeductFee 20 EP.
  // Fail (thiếu số dư) → trả lỗi, đơn vẫn PENDING.
  rpc CollectorAcceptBooking(CollectorAcceptBookingRequest) returns (CollectorAcceptBookingResponse);

  // Driver chốt tại nhà khách: chụp ảnh cân + nhập PIN từ User. Server
  // validate PIN + TTL, đổi status DELIVERED_TO_STATION, gọi
  // Point.IssuePendingReward 2 lần (User + Driver).
  rpc DriverCompleteBooking(DriverCompleteBookingRequest) returns (DriverCompleteBookingResponse);

  // Vựa cân lại, thực thi Quyền Phủ Quyết (Master Doc §4.1):
  //   |lệch| ≤ 10%  → RECONCILED, ConfirmReward cả 2.
  //   |lệch| >  10% → CANCELLED, CancelReward + DeductTrustScore(20) cả 2.
  rpc CollectorVerifyBooking(CollectorVerifyBookingRequest) returns (CollectorVerifyBookingResponse);

  rpc ListMyBookings(ListMyBookingsRequest) returns (ListBookingsResponse);
  rpc ListPendingNearby(ListPendingNearbyRequest) returns (ListBookingsResponse);
  rpc ListBookings(ListBookingsRequest) returns (ListBookingsResponse);
}

enum BookingStatus {
  BOOKING_STATUS_UNSPECIFIED = 0;
  BOOKING_STATUS_PENDING = 1;
  BOOKING_STATUS_ACCEPTED = 2;
  BOOKING_STATUS_COLLECTING = 3;
  BOOKING_STATUS_COMPLETED = 4;
  BOOKING_STATUS_CANCELLED = 5;
  // V1.3 — Vựa arbitration states.
  BOOKING_STATUS_DELIVERED_TO_STATION = 6;
  BOOKING_STATUS_RECONCILED = 7;
}

enum MaterialType {
  MATERIAL_TYPE_UNSPECIFIED = 0;
  MATERIAL_TYPE_PAPER = 1;
  MATERIAL_TYPE_PLASTIC = 2;
  MATERIAL_TYPE_METAL = 3;
  MATERIAL_TYPE_MIXED = 4;
}

message Booking {
  string id = 1;
  string customer_id = 2;
  string collector_id = 3;
  BookingStatus status = 4;
  string address = 5;
  double longitude = 6;
  double latitude = 7;
  ecopoint.common.v1.Decimal estimated_kg = 8;
  string note = 9;
  MaterialType material_type = 10;
  google.protobuf.Timestamp scheduled_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  double distance_m = 14;
  // V1.3 fields:
  string station_id = 15; // set khi >= ACCEPTED
  string pin_code = 16; // chỉ trả về cho customer khi CreateBooking
  google.protobuf.Timestamp pin_expired_at = 17;
  double driver_weight = 18; // Driver chốt tại nhà khách
  double collector_weight = 19; // Vựa cân lại
  string proof_image_url = 20; // ảnh mặt cân điện tử
}

message CreateBookingRequest {
  string customer_id = 1;
  string address = 2;
  double longitude = 3;
  double latitude = 4;
  ecopoint.common.v1.Decimal estimated_kg = 5;
  string note = 6;
  MaterialType material_type = 7;
  google.protobuf.Timestamp scheduled_at = 8;
}

message CreateBookingResponse {
  Booking booking = 1;
}

message CollectorAcceptBookingRequest {
  string booking_id = 1;
  string station_id = 2;
}

message CollectorAcceptBookingResponse {
  Booking booking = 1;
  // tx_id của DeductFee 20 EP — audit trail.
  string point_tx_id = 2;
}

message DriverCompleteBookingRequest {
  string booking_id = 1;
  string driver_id = 2;
  string pin_code = 3;
  string proof_image_url = 4;
  double driver_weight = 5; // kg, có thể lẻ
}

message DriverCompleteBookingResponse {
  Booking booking = 1;
  // 2 tx pending: cấp điểm cho User (kg*10) + Driver (flat 20).
  string user_point_tx_id = 2;
  string driver_point_tx_id = 3;
}

message CollectorVerifyBookingRequest {
  string booking_id = 1;
  double collector_weight = 2;
  string verified_by = 3; // station member user_id
}

message CollectorVerifyBookingResponse {
  Booking booking = 1;
  bool reconciled = 2; // true = pass, false = bị phạt
  double deviation_pct = 3; // |collector - driver| / driver * 100
}

message ListMyBookingsRequest {
  string customer_id = 1;
  int32 limit = 2;
}

message ListBookingsRequest {
  BookingStatus status = 1;
  int32 limit = 2;
}

message ListPendingNearbyRequest {
  double longitude = 1;
  double latitude = 2;
  int32 limit = 3;
}

message ListBookingsResponse {
  repeated Booking bookings = 1;
}
