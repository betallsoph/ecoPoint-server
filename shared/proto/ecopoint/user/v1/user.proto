syntax = "proto3";

package ecopoint.user.v1;

import "google/protobuf/timestamp.proto";

service UserService {
  // ----- Auth -----
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // ----- Profile -----
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);

  // ----- Trust Layer (V1.3 Anti-Fraud) -----
  // Trừ trust_score, floor 0. Idempotency do caller tự đảm bảo
  // (vd: chỉ gọi 1 lần khi booking chuyển sang CANCELLED).
  rpc DeductTrustScore(DeductTrustScoreRequest) returns (DeductTrustScoreResponse);
}

message DeductTrustScoreRequest {
  string user_id = 1;
  int32 amount = 2;
  string reason = 3;
}

message DeductTrustScoreResponse {
  int32 new_trust_score = 1;
}

// ---------------- Domain ----------------

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_CUSTOMER = 1; // Người dân yêu cầu thu gom (legacy)
  USER_ROLE_COLLECTOR = 2; // Driver freelance / Hero (legacy alias)
  USER_ROLE_ADMIN = 3; // Platform admin
  // V1.3:
  USER_ROLE_USER = 4; // Khách hàng (rename customer)
  USER_ROLE_STATION_ADMIN = 5; // Chủ Vựa
  USER_ROLE_STATION_STAFF = 6; // Nhân viên Vựa
}

message User {
  string id = 1;
  string phone = 2;
  string email = 3;
  string full_name = 4;
  string avatar_url = 5;
  UserRole role = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// ---------------- Auth payloads ----------------

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string phone = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  User user = 3;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  UserRole role = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// ---------------- Profile payloads ----------------

message GetUserInfoRequest {
  string user_id = 1;
}

message GetUserInfoResponse {
  User user = 1;
}
